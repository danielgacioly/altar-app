name: Altar
options:
  bundleIdPrefix: com.danielacioly
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Altar:
    type: application
    platform: macOS
    sources:
      - App
      - path: versiculos.json
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.lifestyle
        NSMicrophoneUsageDescription: O Altar usa o microfone para ditar notas e gravar orações.
        NSSpeechRecognitionUsageDescription: O Altar transcreve no próprio Mac as notas ditadas e as orações gravadas.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielacioly.altar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
